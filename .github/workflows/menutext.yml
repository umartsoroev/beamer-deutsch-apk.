name: Menü-Deutsch bauen und auf Android 13 prüfen
on:
  push:
    paths:
      - Beamer-Menutext-Quelle-v1.zip.b64
      - .github/workflows/menutext.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  menu:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: APK bauen und Signatur prüfen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/menu"
          cd "$RUNNER_TEMP/menu"
          base64 -d "$GITHUB_WORKSPACE/Beamer-Menutext-Quelle-v1.zip.b64" > source.zip
          echo '3cf18fbe5e4c7f3dcf9ffa9461e803da36687914732550698f15e8b1b32b8875  source.zip' | sha256sum -c -
          unzip -q source.zip
          sdk="$ANDROID_HOME/platforms/android-35/android.jar"
          bt="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p generated classes dex
          "$bt/aapt2" compile --dir res -o res.zip
          "$bt/aapt2" link -o base.apk -I "$sdk" --manifest AndroidManifest.xml --java generated res.zip
          find src generated -name '*.java' > files.txt
          "$JAVA_HOME_17_X64/bin/javac" --release 11 -encoding UTF-8 -classpath "$sdk" -d classes @files.txt
          jar cf classes.jar -C classes .
          "$bt/d8" --lib "$sdk" --min-api 24 --output dex classes.jar
          (cd dex && zip -q -0 ../base.apk classes.dex)
          "$bt/zipalign" -f 4 base.apk aligned.apk
          keytool -genkeypair -keystore "$RUNNER_TEMP/menu.jks" -storepass android -keypass android -alias menu -keyalg RSA -keysize 3072 -dname CN=Beamer-Menutext -validity 3650
          apk="$GITHUB_WORKSPACE/Beamer-Menue-Deutsch.apk"
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/menu.jks" --ks-pass pass:android --out "$apk" aligned.apk
          "$bt/apksigner" verify --verbose "$apk"
          "$bt/aapt" dump badging "$apk" | grep "^package:"
          (cd "$GITHUB_WORKSPACE" && sha256sum Beamer-Menue-Deutsch.apk)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Beamer-Menue-Deutsch
          path: Beamer-Menue-Deutsch.apk
          retention-days: 14
      - name: Menü-Übersetzung im Android-13-Emulator testen
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager --install 'emulator' 'system-images;android-33;google_apis;x86_64' > "$RUNNER_TEMP/image.log"
          echo no | avdmanager create avd -n menu -k 'system-images;android-33;google_apis;x86_64'
          sudo chmod 666 /dev/kvm
          df -h "$RUNNER_TEMP"
          test -x "$ANDROID_HOME/emulator/emulator"
          echo 'disk.dataPartition.size=768M' >> "$HOME/.android/avd/menu.avd/config.ini"
          adb start-server
          "$ANDROID_HOME/emulator/emulator" -memory 1536 -cores 2 -partition-size 768 -accel on -avd menu -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emu_pid=$!
          trap 'tail -50 "$RUNNER_TEMP/emulator.log"' EXIT
          sleep 6
          kill -0 "$emu_pid"
          timeout 180 adb wait-for-device
          timeout 240 bash -c 'until adb shell getprop sys.boot_completed | grep -q 1; do sleep 3; done'
          adb shell wm size 1280x720
          adb shell wm density 160
          adb shell settings put system accelerometer_rotation 0
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          adb install Beamer-Menue-Deutsch.apk
          adb shell am start -W -n de.beamer.deutsch.menutext/de.beamer.deutsch.MenuActivity
          sleep 2
          adb shell uiautomator dump /sdcard/menu.xml
          adb pull /sdcard/menu.xml "$RUNNER_TEMP/off.xml"
          grep -q 'Bedienungshilfen öffnen' "$RUNNER_TEMP/off.xml"
          adb exec-out screencap -p > "$RUNNER_TEMP/off.png"
          adb shell settings put secure enabled_accessibility_services de.beamer.deutsch.menutext/de.beamer.deutsch.MenuService
          adb shell settings put secure accessibility_enabled 1
          sleep 3
          adb shell dumpsys accessibility > "$RUNNER_TEMP/accessibility.txt"
          grep -q MenuService "$RUNNER_TEMP/accessibility.txt"
          adb exec-out screencap -p > "$RUNNER_TEMP/on.png"
          /usr/bin/python3 - <<'PY'
          import os, re, xml.etree.ElementTree as ET
          from pathlib import Path
          from PIL import Image
          p = Path(os.environ['RUNNER_TEMP'])
          for stage, visible in [('off', False), ('on', True)]:
              pixels = Image.open(p / (stage + '.png')).convert('RGB')
              box = pixels.getbbox()
              count = sum(rgb == (16, 28, 36) for rgb in pixels.getdata())
              assert (count > 30) == visible, (stage, box, count)
          print('Testwort im laufenden Android-Menü überdeckt.')
          PY
